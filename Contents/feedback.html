<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đóng góp ý kiến cho thư viện</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; }
        .container { background-color: white; padding: 20px; border: 1px solid #ccc; max-width: 600px; margin: 0 auto; }
        h2 { color: #800000; font-size: 1.2em; margin-bottom: 10px; }
        .section-title { color: #800000; font-weight: bold; margin-top: 15px; margin-bottom: 10px; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 120px; }
        input[type="text"], input[type="email"] { background-color: #ffff99; border: 1px solid #333; padding: 3px; width: 250px; }
        textarea { width: 100%; height: 100px; border: 1px solid #333; margin-top: 5px; }
        .checkbox-group label { width: auto; display: block; font-weight: normal; margin-bottom: 5px; }
        button { background-color: #ffff99; border: 1px solid #333; padding: 5px 15px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Đóng góp ý kiến cho thư viện của nhà trường</h2>
    
    <form action="thanks.html" method="GET">
        <div class="section-title">1. Thông tin về người góp ý</div>
        <div class="form-group">
            <label for="ten">Họ và tên:</label>
            <input type="text" id="ten" name="ten" required>
        </div>
        <div class="form-group">
            <label for="email">Địa chỉ email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="section-title">2. Đóng góp ý kiến</div>
        <div class="form-group">
            <label for="comment" style="width: 100%;">Ý kiến đóng góp:</label>
            <textarea id="comment" name="comment" required></textarea>
        </div>

        <div class="checkbox-group">
            <p style="margin-bottom: 5px;">Thể loại cần bổ sung thêm sách:</p>
            <label><input type="checkbox" name="genre" value="truyen"> Truyện ngắn</label>
            <label><input type="checkbox" name="genre" value="kynang"> Kĩ năng sống</label>
            <label><input type="checkbox" name="genre" value="it"> Công nghệ thông tin</label>
            <label><input type="checkbox" name="genre" value="tranh"> Truyện tranh</label>
            <label><input type="checkbox" name="genre" value="lichsu"> Lịch sử</label>
        </div>

        <button type="submit">Góp ý</button>
    </form>
</div>

</body>
</html>
